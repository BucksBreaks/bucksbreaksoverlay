<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bucks Breaks NFL Division Controller</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:850px;margin:auto;padding:20px}
h1{margin:0 0 5px;font-size:26px}
.sub{opacity:.7;margin-bottom:15px}
#status{font-size:12px;opacity:.75;margin-bottom:12px}
.actions{display:flex;gap:8px;margin-bottom:15px}
button{cursor:pointer;color:#fff;font-weight:800}
.actions button{padding:10px 14px;border-radius:9px;background:#191919;border:1px solid #444}
.actions .reset{background:#351315;border-color:#7b3438}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.division-btn{
  min-height:86px;padding:14px;border-radius:12px;
  border:2px solid #e31b23;background:#151515;
  display:flex;justify-content:space-between;align-items:center;text-align:left;
}
.division-btn span{font-size:20px}
.division-btn strong{font-size:13px;color:#ddd}
.division-btn.sold{background:#361012;border-color:#ff1c23}
.division-btn.sold strong{color:#ff7377}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Bucks Breaks — NFL Divisions</h1>
<div class="sub">Click a division to mark the entire 4-team spot SOLD or AVAILABLE.</div>
<div id="status">Connecting…</div>
<div class="actions">
  <button id="undo">UNDO</button>
  <button class="reset" id="reset">RESET ALL</button>
</div>
<div class="grid">
<button class="division-btn" data-teams="BUF,MIA,NE,NYJ" data-division="AFC EAST">
  <span>AFC EAST</span><strong>AVAILABLE</strong>
</button><button class="division-btn" data-teams="BAL,CIN,CLE,PIT" data-division="AFC NORTH">
  <span>AFC NORTH</span><strong>AVAILABLE</strong>
</button><button class="division-btn" data-teams="HOU,IND,JAX,TEN" data-division="AFC SOUTH">
  <span>AFC SOUTH</span><strong>AVAILABLE</strong>
</button><button class="division-btn" data-teams="DEN,KC,LV,LAC" data-division="AFC WEST">
  <span>AFC WEST</span><strong>AVAILABLE</strong>
</button><button class="division-btn" data-teams="DAL,NYG,PHI,WAS" data-division="NFC EAST">
  <span>NFC EAST</span><strong>AVAILABLE</strong>
</button><button class="division-btn" data-teams="CHI,DET,GB,MIN" data-division="NFC NORTH">
  <span>NFC NORTH</span><strong>AVAILABLE</strong>
</button><button class="division-btn" data-teams="ATL,CAR,NO,TB" data-division="NFC SOUTH">
  <span>NFC SOUTH</span><strong>AVAILABLE</strong>
</button><button class="division-btn" data-teams="ARI,LAR,SF,SEA" data-division="NFC WEST">
  <span>NFC WEST</span><strong>AVAILABLE</strong>
</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import { firebaseConfig, ROOM_ID } from "./config.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const soldRef = ref(db, `boards/${ROOM_ID}/sold`);
let sold = {};
let history = [];

function render(){
  document.querySelectorAll(".division-btn").forEach(btn => {
    const teams = btn.dataset.teams.split(",");
    const isSold = teams.every(t => !!sold[t]);
    btn.classList.toggle("sold", isSold);
    btn.querySelector("strong").textContent = isSold ? "SOLD" : "AVAILABLE";
  });
}

async function toggleDivision(btn){
  history.push(JSON.parse(JSON.stringify(sold)));
  const teams = btn.dataset.teams.split(",");
  const isSold = teams.every(t => !!sold[t]);
  const changes = {};
  teams.forEach(t => changes[t] = isSold ? null : true);
  await update(soldRef, changes);
}

document.querySelectorAll(".division-btn").forEach(btn => {
  btn.addEventListener("click", () => toggleDivision(btn));
});

document.getElementById("reset").onclick = async () => {
  history.push(JSON.parse(JSON.stringify(sold)));
  await set(soldRef, null);
};

document.getElementById("undo").onclick = async () => {
  if(!history.length) return;
  await set(soldRef, history.pop());
};

onValue(soldRef, snapshot => {
  sold = snapshot.val() || {};
  render();
  document.getElementById("status").textContent = "Connected — division changes are live";
}, () => {
  document.getElementById("status").textContent = "Connection error";
});

render();
</script>
</body>
</html>
