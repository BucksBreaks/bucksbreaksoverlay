<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Team Availability Overlay</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:auto;
  min-height:0;
  background:transparent!important;
  overflow:hidden;
}
body{font-family:Arial,Helvetica,sans-serif}

.overlay{
  width:100vw;
  height:auto;
  padding:3px 4px;
  background:transparent;
}

.board{
  width:100%;
  display:grid;
  grid-template-columns:repeat(16,minmax(0,1fr));
  grid-template-rows:repeat(2,1fr);
  gap:3px;
}

.team{
  position:relative;
  min-width:0;
  height:74px;
  border:1.5px solid rgba(255,28,35,.98);
  border-radius:6px;
  background:rgba(3,3,4,.78);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:
    0 0 5px rgba(255,28,35,.18),
    inset 0 0 10px rgba(255,255,255,.02);
}

.team img{
  width:84%;
  height:84%;
  object-fit:contain;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));
}

.team.sold{
  background:rgba(0,0,0,.84);
  border-color:rgba(120,120,120,.7);
}

.team.sold img{
  opacity:.18;
  filter:grayscale(1);
}

.team.sold::before,.team.sold::after{
  content:"";
  position:absolute;
  width:76%;
  height:5px;
  border-radius:999px;
  background:#ff1c23;
  z-index:3;
  box-shadow:0 0 7px rgba(255,28,35,.75);
}
.team.sold::before{transform:rotate(45deg)}
.team.sold::after{transform:rotate(-45deg)}

@media(max-width:900px){
  .overlay{padding:2px 3px}
  .board{gap:2px}
  .team{height:60px;border-radius:5px}
  .team img{width:86%;height:86%}
  .team.sold::before,.team.sold::after{height:4px}
}
</style>
</head>
<body>
<div class="overlay">
  <div class="board">
    <div class="team" data-team="BUF"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/buf.png" alt="BUF"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import { firebaseConfig, ROOM_ID } from "./config.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const soldRef = ref(db, `boards/${ROOM_ID}/sold`);

onValue(soldRef, snapshot => {
  const sold = snapshot.val() || {};
  document.querySelectorAll(".team").forEach(el => {
    el.classList.toggle("sold", !!sold[el.dataset.team]);
  });
});
</script>
</body>
