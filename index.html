<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Team Availability Overlay</title>
<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:auto;
  min-height:0;
  background:transparent!important;
  overflow:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
}

.overlay{
  width:100vw;
  padding:4px;
  background:transparent;
}

.division{
  width:100%;
  display:grid;
  grid-template-columns:110px repeat(4,minmax(0,1fr));
  gap:4px;
  margin-bottom:4px;
  align-items:center;
}

.division:last-child{
  margin-bottom:0;
}

.division-label{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:4px 6px;
  border-radius:6px;
  background:rgba(8,8,9,.72);
  border:1.5px solid rgba(255,28,35,.95);
  color:#fff;
  font-size:15px;
  font-weight:900;
  line-height:1.05;
  letter-spacing:.35px;
  text-shadow:0 1px 2px rgba(0,0,0,.8);
}

.team{
  position:relative;
  min-width:0;
  height:54px;
  border:1.5px solid rgba(255,28,35,.98);
  border-radius:6px;
  background:rgba(3,3,4,.78);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:
    0 0 5px rgba(255,28,35,.18),
    inset 0 0 10px rgba(255,255,255,.02);
}

.team img{
  width:86%;
  height:86%;
  object-fit:contain;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));
}

.team.sold{
  background:rgba(0,0,0,.86);
  border-color:rgba(120,120,120,.72);
}

.team.sold img{
  opacity:.18;
  filter:grayscale(1);
}

.team.sold::before,
.team.sold::after{
  content:"";
  position:absolute;
  width:68%;
  height:5px;
  border-radius:999px;
  background:#ff1c23;
  z-index:3;
  box-shadow:0 0 7px rgba(255,28,35,.78);
}

.team.sold::before{transform:rotate(45deg)}
.team.sold::after{transform:rotate(-45deg)}

@media(max-width:700px){
  .overlay{padding:3px}

  .division{
    grid-template-columns:84px repeat(4,minmax(0,1fr));
    gap:3px;
    margin-bottom:3px;
  }

  .division-label{
    height:50px;
    font-size:12px;
    border-radius:5px;
  }

  .team{
    height:50px;
    border-radius:5px;
  }

  .team img{
    width:88%;
    height:88%;
  }

  .team.sold::before,
  .team.sold::after{
    height:4px;
  }
}
</style>
</head>
<body>

    <div class="team" data-team="BUF"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/buf.png" alt="BUF"></div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import { firebaseConfig, ROOM_ID } from "./config.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const soldRef = ref(db, `boards/${ROOM_ID}/sold`);

onValue(soldRef, snapshot => {
  const sold = snapshot.val() || {};
  document.querySelectorAll(".team").forEach(el => {
    el.classList.toggle("sold", !!sold[el.dataset.team]);
  });
});
</script>

</body>
</html>
