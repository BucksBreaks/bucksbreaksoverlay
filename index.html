<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Division Availability Overlay</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;width:100%;height:auto;min-height:0;
  background:transparent!important;overflow:hidden;
}
body{font-family:Arial,Helvetica,sans-serif}

.overlay{
  width:100vw;
  padding:4px;
  background:transparent;
}

.board{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(2,1fr);
  gap:6px;
}

.division{
  position:relative;
  min-width:0;
  height:118px;
  border:2px solid rgba(255,28,35,.98);
  border-radius:10px;
  background:rgba(255,255,255,.72);
  overflow:hidden;
  box-shadow:0 0 8px rgba(255,28,35,.18);
}

.division-name{
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.55);
  color:#111;
  font-weight:900;
  font-size:15px;
  letter-spacing:.3px;
  border-bottom:1px solid rgba(255,28,35,.45);
}

.logos{
  height:calc(100% - 28px);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
  align-items:center;
  padding:6px;
}

.logos img{
  width:100%;
  height:100%;
  max-height:72px;
  object-fit:contain;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
}

.division.sold{
  background:rgba(255,255,255,.48);
  border-color:rgba(115,115,115,.8);
}

.division.sold .logos img{
  opacity:.18;
  filter:grayscale(1);
}

.division.sold::before,
.division.sold::after{
  content:"";
  position:absolute;
  left:14%;
  top:54%;
  width:72%;
  height:8px;
  border-radius:999px;
  background:#ff1c23;
  z-index:5;
  box-shadow:0 0 10px rgba(255,28,35,.8);
}

.division.sold::before{transform:rotate(18deg)}
.division.sold::after{transform:rotate(-18deg)}

.division.sold .division-name{
  color:#9a0d12;
}

@media(max-width:900px){
  .board{gap:4px}
  .division{height:104px;border-radius:8px}
  .division-name{height:25px;font-size:12px}
  .logos{height:calc(100% - 25px);padding:4px;gap:2px}
  .division.sold::before,.division.sold::after{height:6px}
}
</style>
</head>
<body>
<div class="overlay">
  <div class="board">
    <div class="division" data-teams="BUF,MIA,NE,NYJ">
  <div class="division-name">AFC EAST</div>
  <div class="logos"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/buf.png" alt="BUF">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/mia.png" alt="MIA">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/ne.png" alt="NE">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/nyj.png" alt="NYJ"></div>
</div><div class="division" data-teams="BAL,CIN,CLE,PIT">
  <div class="division-name">AFC NORTH</div>
  <div class="logos"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/bal.png" alt="BAL">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/cin.png" alt="CIN">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/cle.png" alt="CLE">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/pit.png" alt="PIT"></div>
</div><div class="division" data-teams="HOU,IND,JAX,TEN">
  <div class="division-name">AFC SOUTH</div>
  <div class="logos"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/hou.png" alt="HOU">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/ind.png" alt="IND">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/jax.png" alt="JAX">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/ten.png" alt="TEN"></div>
</div><div class="division" data-teams="DEN,KC,LV,LAC">
  <div class="division-name">AFC WEST</div>
  <div class="logos"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/den.png" alt="DEN">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/kc.png" alt="KC">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/lv.png" alt="LV">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/lac.png" alt="LAC"></div>
</div><div class="division" data-teams="DAL,NYG,PHI,WAS">
  <div class="division-name">NFC EAST</div>
  <div class="logos"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/dal.png" alt="DAL">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/nyg.png" alt="NYG">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/phi.png" alt="PHI">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/was.png" alt="WAS"></div>
</div><div class="division" data-teams="CHI,DET,GB,MIN">
  <div class="division-name">NFC NORTH</div>
  <div class="logos"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/chi.png" alt="CHI">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/det.png" alt="DET">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/gb.png" alt="GB">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/min.png" alt="MIN"></div>
</div><div class="division" data-teams="ATL,CAR,NO,TB">
  <div class="division-name">NFC SOUTH</div>
  <div class="logos"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/atl.png" alt="ATL">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/car.png" alt="CAR">

</div><div class="division" data-teams="ARI,LAR,SF,SEA">
  <div class="division-name">NFC WEST</div>
  <div class="logos"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/ari.png" alt="ARI">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/lar.png" alt="LAR">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/sf.png" alt="SF">
<img src="https://a.espncdn.com/i/teamlogos/nfl/500/sea.png" alt="SEA"></div>
</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import { firebaseConfig, ROOM_ID } from "./config.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const soldRef = ref(db, `boards/${ROOM_ID}/sold`);

onValue(soldRef, snapshot => {
  const sold = snapshot.val() || {};
  document.querySelectorAll(".division").forEach(el => {
    const teams = el.dataset.teams.split(",");
    const divisionSold = teams.every(team => !!sold[team]);
    el.classList.toggle("sold", divisionSold);
  });
});
</script>
</body>
</html>
