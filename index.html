<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Team Availability Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif}

.overlay{
  width:100vw;
  height:25vh;
  min-height:210px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,rgba(8,8,10,.72),rgba(8,8,10,.48));
  border-top:1px solid rgba(255,55,55,.75);
  border-bottom:1px solid rgba(255,55,55,.75);
  box-shadow:0 0 22px rgba(220,0,0,.18) inset;
  backdrop-filter:blur(2px);
}

.board{
  width:100%;
  display:grid;
  grid-template-columns:repeat(16,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:6px;
}

.team{
  position:relative;
  min-width:0;
  height:min(9.3vh,86px);
  border:1.5px solid rgba(238,35,42,.9);
  border-radius:8px;
  background:rgba(8,8,10,.58);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 8px rgba(230,20,25,.12);
  overflow:hidden;
}

.team img{
  width:76%;
  height:76%;
  object-fit:contain;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));
}

.team.sold{
  background:rgba(5,5,6,.78);
  border-color:rgba(115,115,115,.65);
}

.team.sold img{
  opacity:.18;
  filter:grayscale(1);
}

.team.sold::before,.team.sold::after{
  content:"";
  position:absolute;
  width:70%;
  height:5px;
  border-radius:999px;
  background:#ef2028;
  z-index:3;
  box-shadow:0 0 7px rgba(239,32,40,.65);
}
.team.sold::before{transform:rotate(45deg)}
.team.sold::after{transform:rotate(-45deg)}

@media(max-width:900px){
  .overlay{height:25vh;min-height:150px;padding:6px}
  .board{gap:3px}
  .team{height:min(9vh,64px);border-radius:5px}
  .team.sold::before,.team.sold::after{height:3px}
}
</style>
</head>
<body>
<div class="overlay">
  <div class="board">
    <div class="team" data-team="BUF"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/buf.png" alt="BUF"></div>

<div class="team" data-team="DEN"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/den.png" alt="DEN"></div>
<div class="team" data-team="KC"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/kc.png" alt="KC"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import { firebaseConfig, ROOM_ID } from "./config.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const soldRef = ref(db, `boards/${ROOM_ID}/sold`);

onValue(soldRef, snapshot => {
  const sold = snapshot.val() || {};
  document.querySelectorAll(".team").forEach(el => {
    el.classList.toggle("sold", !!sold[el.dataset.team]);
  });
});
</script>
</body>
</html>
