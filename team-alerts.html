<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bucks Breaks Team Alerts</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;pointer-events:none}
.fx{position:absolute;inset:0;overflow:hidden;--accent:#e31b23;--secondary:#111}
.hero{position:absolute;width:min(34vw,360px);height:min(34vw,360px);left:-38vw;top:32%;object-fit:contain;filter:drop-shadow(0 18px 16px rgba(0,0,0,.42));z-index:5;will-change:transform,opacity}
.label{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%) scale(.55);font-size:clamp(36px,8vw,88px);font-weight:1000;color:#fff;letter-spacing:.08em;text-align:center;text-shadow:0 5px 0 #000,0 0 24px var(--accent);opacity:0;z-index:9;white-space:nowrap;animation:labelPop 3s ease forwards}
.label small{display:block;font-size:.34em;color:var(--accent);letter-spacing:.22em;margin-top:4px}
.trail{position:absolute;height:10px;width:48vw;border-radius:999px;background:linear-gradient(90deg,transparent,var(--secondary),var(--accent),white);filter:blur(2px);opacity:.8;z-index:2}
.particle{position:absolute;z-index:3;pointer-events:none;animation:particle 1.1s ease-out forwards}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .5s ease-out}
.ring{position:absolute;left:50%;top:50%;width:24px;height:24px;border:8px solid var(--accent);border-radius:50%;transform:translate(-50%,-50%);opacity:.9;animation:ring 1.1s ease-out forwards}
.shard{position:absolute;left:50%;top:43%;width:min(30vw,310px);height:min(30vw,310px);transform:translate(-50%,-50%);object-fit:contain;z-index:8;pointer-events:none;animation:shardFly 1s cubic-bezier(.18,.72,.22,1) forwards}
.centerLogo{position:absolute;left:50%;top:43%;width:min(30vw,310px);height:min(30vw,310px);transform:translate(-50%,-50%) scale(.3);object-fit:contain;opacity:0;z-index:7;animation:centerHit .75s ease-out forwards}

/* Team-specific movement */
.charge .hero{animation:charge 2s cubic-bezier(.12,.75,.2,1) forwards}
.bull .hero{animation:bullCharge 2.05s cubic-bezier(.12,.75,.2,1) forwards}
.splash .hero{top:49%;animation:dolphin 2.2s cubic-bezier(.14,.7,.28,1) forwards}
.jet .hero{top:31%;animation:jet 1.55s linear forwards}
.swoop .hero{top:16%;animation:swoop 2.15s cubic-bezier(.18,.72,.22,1) forwards}
.pounce .hero,.maul .hero,.roar .hero{animation:pounce 2s ease-out forwards}
.slam .hero,.giant .hero,.ram .hero{left:50%;top:-35%;animation:slam 1.8s ease-out forwards}
.steel .hero,.pack .hero{animation:spinAcross 2s ease-out forwards}
.gallop .hero{animation:gallop 2.05s ease-out forwards}
.titan .hero,.viking .hero,.command .hero,.saint .hero{animation:powerAcross 2s ease-out forwards}
.arrow .hero{animation:arrow 1.65s ease-out forwards}
.raid .hero,.cannon .hero{animation:raid 2s ease-out forwards}
.bolt .hero{animation:bolt 1.45s ease-out forwards}
.star .hero{animation:starSpin 1.9s ease-out forwards}
.goldrush .hero{animation:goldRush 1.9s ease-out forwards}
.patriot .hero{animation:patriot 1.9s ease-out forwards}

@keyframes charge{
  0%{transform:translateX(0) scale(.78);opacity:.3}
  48%{transform:translateX(72vw) scale(1.22);opacity:1}
  60%{transform:translateX(79vw) scale(1.16)}
  100%{transform:translateX(150vw) scale(.95)}
}
@keyframes bullCharge{
  0%{transform:translateX(0) scale(.76) rotate(-5deg);opacity:.2}
  42%{transform:translateX(64vw) scale(1.26) rotate(3deg);opacity:1}
  58%{transform:translateX(78vw) scale(1.14) rotate(-2deg)}
  100%{transform:translateX(150vw) scale(.9) rotate(4deg)}
}
@keyframes dolphin{
  0%{transform:translate(-5vw,28vh) rotate(-24deg) scale(.7);opacity:0}
  38%{transform:translate(57vw,-26vh) rotate(-5deg) scale(1.18);opacity:1}
  62%{transform:translate(88vw,-8vh) rotate(15deg) scale(1.1)}
  100%{transform:translate(150vw,34vh) rotate(28deg) scale(.8);opacity:.8}
}
@keyframes jet{
  0%{transform:translate(-8vw,18vh) rotate(-10deg) scale(.72)}
  100%{transform:translate(155vw,-22vh) rotate(-10deg) scale(1.05)}
}
@keyframes swoop{
  0%{transform:translate(-10vw,26vh) rotate(-20deg) scale(.72)}
  45%{transform:translate(65vw,-8vh) rotate(8deg) scale(1.2)}
  100%{transform:translate(150vw,-18vh) rotate(15deg) scale(.82)}
}
@keyframes pounce{
  0%{transform:translateX(0) translateY(10vh) scale(.7)}
  45%{transform:translateX(62vw) translateY(-13vh) scale(1.24)}
  62%{transform:translateX(82vw) translateY(2vh) scale(1.13)}
  100%{transform:translateX(150vw) translateY(-8vh) scale(.9)}
}
@keyframes slam{
  0%{transform:translate(-50%,-20vh) scale(.6);opacity:0}
  42%{transform:translate(-50%,54vh) scale(1.28);opacity:1}
  58%{transform:translate(-50%,48vh) scale(1.08)}
  100%{transform:translate(-50%,115vh) scale(.88);opacity:0}
}
@keyframes spinAcross{
  0%{transform:translateX(0) rotate(0deg) scale(.7)}
  100%{transform:translateX(148vw) rotate(1080deg) scale(1.05)}
}
@keyframes gallop{
  0%{transform:translateX(0) scale(.72)}
  30%{transform:translateX(45vw) translateY(-4vh) scale(1)}
  55%{transform:translateX(78vw) translateY(3vh) scale(1.18)}
  100%{transform:translateX(150vw) translateY(-2vh) scale(.9)}
}
@keyframes powerAcross{
  0%{transform:translateX(0) scale(.7);filter:drop-shadow(0 0 0 var(--accent))}
  50%{transform:translateX(72vw) scale(1.25);filter:drop-shadow(0 0 25px var(--accent))}
  100%{transform:translateX(150vw) scale(.88)}
}
@keyframes arrow{
  0%{transform:translateX(0) scale(.6)}
  70%{transform:translateX(92vw) scale(1.22)}
  100%{transform:translateX(155vw) scale(.85)}
}
@keyframes raid{
  0%{transform:translateX(0) rotate(-8deg) scale(.75)}
  50%{transform:translateX(70vw) rotate(5deg) scale(1.22)}
  100%{transform:translateX(150vw) rotate(-5deg) scale(.9)}
}
@keyframes bolt{
  0%{transform:translate(-5vw,15vh) scale(.6);opacity:0}
  12%{opacity:1}
  55%{transform:translate(75vw,-12vh) scale(1.38)}
  100%{transform:translate(150vw,10vh) scale(.8);opacity:0}
}
@keyframes starSpin{
  0%{transform:translateX(0) rotate(0) scale(.6)}
  55%{transform:translateX(76vw) rotate(540deg) scale(1.3)}
  100%{transform:translateX(150vw) rotate(900deg) scale(.85)}
}
@keyframes goldRush{
  0%{transform:translateX(0) scale(.7)}
  50%{transform:translateX(70vw) scale(1.24) rotate(-4deg)}
  100%{transform:translateX(150vw) scale(.9) rotate(6deg)}
}
@keyframes patriot{
  0%{transform:translateX(0) scale(.68)}
  45%{transform:translateX(65vw) scale(1.22)}
  100%{transform:translateX(150vw) scale(.9)}
}
@keyframes labelPop{
  0%,42%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  54%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  75%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}
}
@keyframes particle{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.6);opacity:0}}
@keyframes ring{to{width:92vw;height:92vw;opacity:0}}
@keyframes flash{0%{opacity:0}35%{opacity:.82}100%{opacity:0}}
@keyframes centerHit{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  55%{opacity:1;transform:translate(-50%,-50%) scale(1.28)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}
}
@keyframes shardFly{
  0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) rotate(0deg) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--sx),var(--sy)) rotate(var(--sr)) scale(.65)}
}
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import { firebaseConfig, ROOM_ID } from "./config.js";

const META={"BUF": {"name": "BILLS", "slug": "buf", "effect": "charge", "accent": "#C60C30", "secondary": "#00338D"}, "MIA": {"name": "DOLPHINS", "slug": "mia", "effect": "splash", "accent": "#008E97", "secondary": "#FC4C02"}, "NE": {"name": "PATRIOTS", "slug": "ne", "effect": "patriot", "accent": "#C8102E", "secondary": "#002244"}, "NYJ": {"name": "JETS", "slug": "nyj", "effect": "jet", "accent": "#125740", "secondary": "#FFFFFF"}, "BAL": {"name": "RAVENS", "slug": "bal", "effect": "swoop", "accent": "#241773", "secondary": "#9E7C0C"}, "CIN": {"name": "BENGALS", "slug": "cin", "effect": "pounce", "accent": "#FB4F14", "secondary": "#000000"}, "CLE": {"name": "BROWNS", "slug": "cle", "effect": "slam", "accent": "#FF3C00", "secondary": "#311D00"}, "PIT": {"name": "STEELERS", "slug": "pit", "effect": "steel", "accent": "#FFB612", "secondary": "#101820"}, "HOU": {"name": "TEXANS", "slug": "hou", "effect": "bull", "accent": "#03202F", "secondary": "#A71930"}, "IND": {"name": "COLTS", "slug": "ind", "effect": "gallop", "accent": "#002C5F", "secondary": "#FFFFFF"}, "JAX": {"name": "JAGUARS", "slug": "jax", "effect": "pounce", "accent": "#00A5B5", "secondary": "#D7A22A"}, "TEN": {"name": "TITANS", "slug": "ten", "effect": "titan", "accent": "#4B92DB", "secondary": "#C8102E"}, "DEN": {"name": "BRONCOS", "slug": "den", "effect": "gallop", "accent": "#FB4F14", "secondary": "#002244"}, "KC": {"name": "CHIEFS", "slug": "kc", "effect": "arrow", "accent": "#E31837", "secondary": "#FFB81C"}, "LV": {"name": "RAIDERS", "slug": "lv", "effect": "raid", "accent": "#A5ACAF", "secondary": "#000000"}, "LAC": {"name": "CHARGERS", "slug": "lac", "effect": "bolt", "accent": "#0080C6", "secondary": "#FFC20E"}, "DAL": {"name": "COWBOYS", "slug": "dal", "effect": "star", "accent": "#003594", "secondary": "#869397"}, "NYG": {"name": "GIANTS", "slug": "nyg", "effect": "giant", "accent": "#0B2265", "secondary": "#A71930"}, "PHI": {"name": "EAGLES", "slug": "phi", "effect": "swoop", "accent": "#004C54", "secondary": "#A5ACAF"}, "WAS": {"name": "COMMANDERS", "slug": "was", "effect": "command", "accent": "#5A1414", "secondary": "#FFB612"}, "CHI": {"name": "BEARS", "slug": "chi", "effect": "maul", "accent": "#C83803", "secondary": "#0B162A"}, "DET": {"name": "LIONS", "slug": "det", "effect": "roar", "accent": "#0076B6", "secondary": "#B0B7BC"}, "GB": {"name": "PACKERS", "slug": "gb", "effect": "pack", "accent": "#203731", "secondary": "#FFB612"}, "MIN": {"name": "VIKINGS", "slug": "min", "effect": "viking", "accent": "#4F2683", "secondary": "#FFC62F"}, "ATL": {"name": "FALCONS", "slug": "atl", "effect": "swoop", "accent": "#A71930", "secondary": "#000000"}, "CAR": {"name": "PANTHERS", "slug": "car", "effect": "pounce", "accent": "#0085CA", "secondary": "#101820"}, "NO": {"name": "SAINTS", "slug": "no", "effect": "saint", "accent": "#D3BC8D", "secondary": "#101820"}, "TB": {"name": "BUCCANEERS", "slug": "tb", "effect": "cannon", "accent": "#D50A0A", "secondary": "#34302B"}, "ARI": {"name": "CARDINALS", "slug": "ari", "effect": "swoop", "accent": "#97233F", "secondary": "#000000"}, "LAR": {"name": "RAMS", "slug": "lar", "effect": "ram", "accent": "#003594", "secondary": "#FFA300"}, "SF": {"name": "49ERS", "slug": "sf", "effect": "goldrush", "accent": "#AA0000", "secondary": "#B3995D"}, "SEA": {"name": "SEAHAWKS", "slug": "sea", "effect": "swoop", "accent": "#002244", "secondary": "#69BE28"}};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const soldRef=ref(db,`boards/${ROOM_ID}/teamBreakSold`);

let initialized=false;
let previous={};
let queue=[];
let busy=false;

function logoUrl(slug){
  return `https://a.espncdn.com/i/teamlogos/nfl/500/${slug}.png`;
}

function particle(fx, text, x, y, size=34){
  const p=document.createElement("div");
  p.className="particle";
  p.textContent=text;
  p.style.left=x+"%";
  p.style.top=y+"%";
  p.style.fontSize=(size+Math.random()*24)+"px";
  p.style.setProperty("--dx",(Math.random()*360-180)+"px");
  p.style.setProperty("--dy",(Math.random()*260-130)+"px");
  p.style.setProperty("--r",(Math.random()*260-130)+"deg");
  fx.appendChild(p);
}

function addTeamEffects(code, fx, m){
  const type=m.effect;

  if(type==="charge"){
    for(let i=0;i<22;i++) setTimeout(()=>particle(fx,"💨",8+Math.random()*84,56+Math.random()*18,28),i*48);
  }
  if(type==="bull"){
    for(let i=0;i<14;i++) setTimeout(()=>particle(fx,"✨",12+Math.random()*80,48+Math.random()*24,22),i*55);
    for(let i=0;i<10;i++) setTimeout(()=>particle(fx,"💨",12+Math.random()*80,60+Math.random()*14,24),i*65);
  }
  if(type==="splash"){
    for(let i=0;i<30;i++) setTimeout(()=>particle(fx,Math.random()>.45?"💦":"💧",12+Math.random()*78,38+Math.random()*36,26),i*38);
  }
  if(type==="swoop"){
    for(let i=0;i<16;i++) setTimeout(()=>particle(fx,"🪶",10+Math.random()*82,18+Math.random()*40,25),i*65);
  }
  if(["pounce","maul","roar"].includes(type)){
    for(let i=0;i<12;i++) setTimeout(()=>particle(fx,"💨",10+Math.random()*82,58+Math.random()*16,26),i*55);
  }
  if(type==="jet"){
    const t=document.createElement("div");t.className="trail";t.style.left="-30vw";t.style.top="44%";fx.appendChild(t);
    for(let i=0;i<16;i++) setTimeout(()=>particle(fx,"💨",8+Math.random()*84,36+Math.random()*20,22),i*35);
  }
  if(type==="bolt"){
    const flash=document.createElement("div");flash.className="flash";fx.appendChild(flash);
    for(let i=0;i<20;i++) particle(fx,"⚡",10+Math.random()*80,15+Math.random()*68,25);
  }
  if(["slam","giant","ram","titan","viking","command","saint","raid","cannon","goldrush","patriot","star","steel","pack","arrow"].includes(type)){
    const r=document.createElement("div");r.className="ring";fx.appendChild(r);
  }
}

function shatterLogo(fx,m){
  const src=logoUrl(m.slug);
  const center=document.createElement("img");
  center.className="centerLogo";
  center.src=src;
  fx.appendChild(center);

  const clips=[
    "polygon(0 0,33% 0,25% 35%,0 28%)",
    "polygon(33% 0,66% 0,58% 32%,25% 35%)",
    "polygon(66% 0,100% 0,100% 30%,58% 32%)",
    "polygon(0 28%,25% 35%,30% 66%,0 60%)",
    "polygon(25% 35%,58% 32%,62% 64%,30% 66%)",
    "polygon(58% 32%,100% 30%,100% 62%,62% 64%)",
    "polygon(0 60%,30% 66%,34% 100%,0 100%)",
    "polygon(30% 66%,62% 64%,66% 100%,34% 100%)",
    "polygon(62% 64%,100% 62%,100% 100%,66% 100%)"
  ];

  setTimeout(()=>{
    clips.forEach((clip,i)=>{
      const shard=document.createElement("img");
      shard.className="shard";
      shard.src=src;
      shard.style.clipPath=clip;
      const angle=(Math.PI*2*i/clips.length)+(Math.random()*.4-.2);
      const dist=170+Math.random()*260;
      shard.style.setProperty("--sx",Math.cos(angle)*dist+"px");
      shard.style.setProperty("--sy",Math.sin(angle)*dist+"px");
      shard.style.setProperty("--sr",(Math.random()*520-260)+"deg");
      fx.appendChild(shard);
    });
    const flash=document.createElement("div");flash.className="flash";fx.appendChild(flash);
  },1450);
}

function enqueue(code){
  queue.push(code);
  playNext();
}

function playNext(){
  if(busy||!queue.length)return;
  busy=true;

  const code=queue.shift();
  const m=META[code];
  const fx=document.createElement("div");
  fx.className=`fx ${m.effect}`;
  fx.style.setProperty("--accent",m.accent);
  fx.style.setProperty("--secondary",m.secondary);

  const hero=document.createElement("img");
  hero.className="hero";
  hero.src=logoUrl(m.slug);
  hero.alt="";
  fx.appendChild(hero);

  const label=document.createElement("div");
  label.className="label";
  label.innerHTML=`${m.name}<small>TAKEN!</small>`;
  fx.appendChild(label);

  document.getElementById("stage").appendChild(fx);
  addTeamEffects(code,fx,m);
  shatterLogo(fx,m);

  setTimeout(()=>{
    fx.remove();
    busy=false;
    setTimeout(playNext,140);
  },3300);
}

onValue(soldRef,snap=>{
  const current=snap.val()||{};
  if(!initialized){
    previous={...current};
    initialized=true;
    return;
  }

  Object.keys(META).forEach(code=>{
    if(!previous[code]&&current[code]) enqueue(code);
  });

  previous={...current};
});
</script>
</body>
</html>
