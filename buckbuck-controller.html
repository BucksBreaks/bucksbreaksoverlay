<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buck Buck Controller</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:760px;margin:auto;padding:24px}
h1{margin:0 0 6px}.sub{color:#aaa;margin-bottom:18px}
#rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr 110px 44px;gap:8px;align-items:center}
input[type=text]{width:100%;padding:12px 14px;border-radius:9px;border:1px solid #444;background:#1c1c1c;color:#fff;font-size:18px}
.toggle{display:flex;align-items:center;justify-content:center;gap:7px;background:#1c1c1c;border:1px solid #444;border-radius:9px;padding:11px 8px;font-weight:800}
.remove{height:44px;border-radius:9px;border:1px solid #555;background:#241214;color:#fff;font-size:20px;cursor:pointer}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:12px 16px;color:#fff;font-weight:900;cursor:pointer;background:#333}
.primary{background:#e31b23}.add{background:#202020;border:1px solid #555}
#status{margin-top:12px;color:#aaa}
</style>
</head>
<body>
<div class="wrap">
<h1>BUCK BUCK</h1>
<div class="sub">Type exactly what you want shown — including “1.”, “2.”, etc. Check TAKEN to cross that line off live.</div>
<div id="rows"></div>
<div class="actions">
  <button class="add" id="addRow">+ ADD LINE</button>
  <button class="primary" id="save">UPDATE OVERLAY</button>
</div>
<div id="status">Ready</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import { firebaseConfig, ROOM_ID } from "./config.js";

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const entriesRef=ref(db,`boards/${ROOM_ID}/buckbuck/entries`);
const rows=document.getElementById("rows");
const status=document.getElementById("status");

function addRow(entry={name:"",taken:false}){
  const row=document.createElement("div");
  row.className="row";
  row.innerHTML=`
    <input class="nm" type="text" value="${String(entry.name||"").replaceAll('"','&quot;')}" placeholder="1. BAILEY">
    <label class="toggle"><input class="tk" type="checkbox" ${entry.taken?"checked":""}> TAKEN</label>
    <button class="remove" title="Remove line">×</button>`;
  row.querySelector(".remove").onclick=()=>row.remove();
  rows.appendChild(row);
}

onValue(entriesRef,snap=>{
  const data=snap.val()||[];
  const entries=Array.isArray(data)?data:Object.values(data);
  rows.innerHTML="";
  if(entries.length){ entries.forEach(addRow); }
  else { for(let i=0;i<6;i++) addRow(); }
  status.textContent="Connected";
},{onlyOnce:true});

document.getElementById("addRow").onclick=()=>addRow();

document.getElementById("save").onclick=async()=>{
  const entries=[...document.querySelectorAll(".row")].map(r=>({
    name:r.querySelector(".nm").value.trim(),
    taken:r.querySelector(".tk").checked
  })).filter(e=>e.name);
  status.textContent="Updating...";
  await set(entriesRef,entries);
  status.textContent="✓ Updated";
  setTimeout(()=>status.textContent="Ready",1500);
};
</script>
</body>
</html>
