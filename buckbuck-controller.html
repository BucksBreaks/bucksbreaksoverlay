<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buck Buck Controller</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px;
  background:#111;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  max-width:650px;
  margin:auto;
}

h1{
  margin:0 0 5px;
  font-size:34px;
}

.subtitle{
  color:#aaa;
  margin-bottom:25px;
}

textarea{
  width:100%;
  height:400px;
  background:#202020;
  border:2px solid #e31b23;
  border-radius:12px;
  padding:18px;
  color:white;
  font-size:24px;
  line-height:1.6;
  resize:vertical;
  outline:none;
}

textarea:focus{
  box-shadow:0 0 15px rgba(227,27,35,.5);
}

button{
  width:100%;
  margin-top:15px;
  padding:18px;
  border:0;
  border-radius:10px;
  background:#e31b23;
  color:white;
  font-size:22px;
  font-weight:900;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.15);
}

#status{
  margin-top:12px;
  text-align:center;
  color:#aaa;
  font-weight:bold;
}

.tip{
  margin-top:20px;
  padding:15px;
  background:#1c1c1c;
  border-radius:10px;
  color:#ccc;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<h1>BUCK BUCK</h1>

<div class="subtitle">
Type one name per line.
</div>

<textarea
  id="names"
  placeholder="Bailey&#10;John&#10;Maui&#10;Wendy&#10;NHK">
</textarea>

<button id="update">
UPDATE OVERLAY
</button>

<div id="status">
Ready
</div>

<div class="tip">
Each line becomes one name on the Buck Buck overlay.
Delete a name from this box and click Update Overlay to remove it.
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

import {
  firebaseConfig,
  ROOM_ID
}
from "./config.js";


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const namesRef =
  ref(db, `boards/${ROOM_ID}/buckbuck/names`);

const textarea =
  document.getElementById("names");

const button =
  document.getElementById("update");

const status =
  document.getElementById("status");


/* Load whatever names are already saved */

onValue(namesRef, snapshot => {

  const data = snapshot.val() || [];

  const names = Array.isArray(data)
    ? data
    : Object.values(data);

  textarea.value =
    names.filter(Boolean).join("\n");

});


/* Send names to the live overlay */

button.addEventListener("click", async () => {

  const names =
    textarea.value
      .split("\n")
      .map(name => name.trim())
      .filter(Boolean);

  status.textContent = "Updating...";

  try {

    await set(namesRef, names);

    status.textContent =
      "✓ Overlay updated!";

    setTimeout(() => {
      status.textContent = "Ready";
    }, 2000);

  } catch(error) {

    console.error(error);

    status.textContent =
      "Error updating overlay";

  }

});

</script>

</body>
</html>
