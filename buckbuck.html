<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buck Buck Overlay</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent!important;
  font-family:Arial,Helvetica,sans-serif;
}

#overlay{
  position:relative;
  width:100vw;
  height:100vh;
  background:url("./buckbuck.png") top center/contain no-repeat;
}

/* One invisible placement area per red box */
.slot{
  position:absolute;
  left:14.8%;
  width:70.4%;
  height:4.55%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 6%;
  overflow:hidden;
}

/* Positions matched to the current Buck Buck PNG */
.slot:nth-child(1){top:26.15%}
.slot:nth-child(2){top:32.08%}
.slot:nth-child(3){top:38.02%}
.slot:nth-child(4){top:43.96%}
.slot:nth-child(5){top:49.90%}
.slot:nth-child(6){top:55.84%}
.slot:nth-child(7){top:61.78%}
.slot:nth-child(8){top:67.72%}
.slot:nth-child(9){top:73.66%}
.slot:nth-child(10){top:79.60%}
.slot:nth-child(11){top:85.54%}

.text{
  position:relative;
  display:inline-block;
  max-width:100%;
  white-space:nowrap;
  color:#fff;
  font-family:"Arial Black",Impact,Arial,sans-serif;
  font-weight:1000;
  line-height:.95;
  letter-spacing:.01em;
  text-align:center;
  text-transform:uppercase;
  -webkit-text-stroke:.7px #111;
  text-shadow:
    0 2px 2px rgba(0,0,0,.95),
    0 0 5px rgba(0,0,0,.95),
    0 0 8px rgba(255,20,28,.45);
  transform-origin:center center;
}

/*
  TAKEN effect:
  The red line is attached DIRECTLY TO THE TEXT SPAN.
  Its width is therefore only the width of the actual name,
  never the page and never the whole overlay.
*/
.slot.taken .text{
  opacity:.48;
}

.slot.taken .text::after{
  content:"";
  position:absolute;
  left:-4px;
  right:-4px;
  top:50%;
  height:4px;
  transform:translateY(-50%);
  border-radius:999px;
  background:#ff2028;
  box-shadow:
    0 0 2px rgba(0,0,0,.9),
    0 0 6px rgba(255,32,40,.95);
  pointer-events:none;
}
</style>
</head>

<body>
<div id="overlay"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import { firebaseConfig, ROOM_ID } from "./config.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const entriesRef = ref(db, `boards/${ROOM_ID}/buckbuck/entries`);
const overlay = document.getElementById("overlay");

function fitText(slot){
  const text = slot.querySelector(".text");
  if(!text) return;

  const maxWidth = slot.clientWidth * .90;
  const maxHeight = slot.clientHeight * .84;

  // Start large for phone readability.
  let size = Math.max(16, Math.min(68, slot.clientHeight * .98));

  text.style.fontSize = size + "px";
  text.style.transform = "scaleX(1)";

  // Only shrink when required.
  while(
    (text.scrollWidth > maxWidth || text.scrollHeight > maxHeight) &&
    size > 13
  ){
    size -= .5;
    text.style.fontSize = size + "px";
  }

  // Final horizontal squeeze only for unusually long names.
  if(text.scrollWidth > maxWidth){
    const scale = Math.max(.74, maxWidth / text.scrollWidth);
    text.style.transform = `scaleX(${scale})`;
  }
}

function render(entries){
  overlay.innerHTML = "";

  entries
    .filter(entry => entry && entry.name && String(entry.name).trim())
    .slice(0,11)
    .forEach(entry => {
      const slot = document.createElement("div");
      slot.className = "slot" + (entry.taken ? " taken" : "");

      const text = document.createElement("span");
      text.className = "text";
      text.textContent = String(entry.name);

      slot.appendChild(text);
      overlay.appendChild(slot);

      requestAnimationFrame(() => fitText(slot));
    });
}

onValue(entriesRef, snapshot => {
  const data = snapshot.val() || [];
  const entries = Array.isArray(data) ? data : Object.values(data);
  render(entries);
});

window.addEventListener("resize", () => {
  document.querySelectorAll(".slot").forEach(fitText);
});
</script>

</body>
</html>
