<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buck Buck Overlay</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent!important;
  font-family:Arial,Helvetica,sans-serif;
}

#overlay{
  position:relative;
  width:100vw;
  height:100vh;
  background:url("./buckbuck.png") top center/contain no-repeat;
}

/* Each name lives in its own fixed box */
.slot{
  position:absolute;
  left:14.8%;
  width:70.4%;
  height:4.55%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 7%;
  overflow:hidden;
}

/* Fine-tuned vertical placement for the 11 boxes */
.slot:nth-child(1){top:26.15%}
.slot:nth-child(2){top:32.08%}
.slot:nth-child(3){top:38.02%}
.slot:nth-child(4){top:43.96%}
.slot:nth-child(5){top:49.90%}
.slot:nth-child(6){top:55.84%}
.slot:nth-child(7){top:61.78%}
.slot:nth-child(8){top:67.72%}
.slot:nth-child(9){top:73.66%}
.slot:nth-child(10){top:79.60%}
.slot:nth-child(11){top:85.54%}

.text{
  position:relative;
  z-index:2;

  display:block;
  max-width:100%;
  white-space:nowrap;

  color:#fff;
  font-family:"Arial Black",Impact,Arial,sans-serif;
  font-weight:1000;
  line-height:.92;
  letter-spacing:.015em;
  text-align:center;
  text-transform:uppercase;

  -webkit-text-stroke:.65px #151515;
  text-shadow:
    0 2px 2px rgba(0,0,0,.95),
    0 0 5px rgba(0,0,0,.9),
    0 0 8px rgba(255,20,28,.45);

  transform-origin:center center;
}

/* Fade text only after the spot is taken */
.slot.taken .text{
  opacity:.38;
}

/*
  IMPORTANT:
  The cross-out is a real child element, NOT a pseudo-element.
  It is only 72% of the box width and centered.
  Because the parent .slot has overflow:hidden,
  it physically cannot leave the box.
*/
.strike{
  display:none;
  position:absolute;
  z-index:4;

  left:14%;
  width:72%;
  top:50%;

  height:4px;
  transform:translateY(-50%);

  border-radius:999px;
  background:#ff2028;

  box-shadow:
    0 0 2px rgba(0,0,0,.95),
    0 0 6px rgba(255,32,40,.95);
}

.slot.taken .strike{
  display:block;
}
</style>
</head>

<body>
<div id="overlay"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

import {
  firebaseConfig,
  ROOM_ID
}
from "./config.js";


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const entriesRef =
  ref(db, `boards/${ROOM_ID}/buckbuck/entries`);

const overlay =
  document.getElementById("overlay");


function fitText(slot){

  const text =
    slot.querySelector(".text");

  if(!text) return;

  const maxWidth =
    slot.clientWidth * .84;

  const maxHeight =
    slot.clientHeight * .80;

  /*
    Start large and bold.
    Only shrink when a longer name requires it.
  */
  let size =
    Math.max(
      15,
      Math.min(
        62,
        slot.clientHeight * .90
      )
    );

  text.style.fontSize =
    size + "px";

  text.style.transform =
    "scaleX(1)";


  while(
    (
      text.scrollWidth > maxWidth ||
      text.scrollHeight > maxHeight
    )
    &&
    size > 12
  ){

    size -= .5;

    text.style.fontSize =
      size + "px";
  }


  /*
    Extra safeguard for very long names.
  */
  if(text.scrollWidth > maxWidth){

    const scale =
      Math.max(
        .72,
        maxWidth / text.scrollWidth
      );

    text.style.transform =
      `scaleX(${scale})`;
  }
}


function render(entries){

  overlay.innerHTML = "";


  entries
    .filter(entry =>
      entry &&
      entry.name &&
      String(entry.name).trim()
    )

    .slice(0,11)

    .forEach(entry => {

      const slot =
        document.createElement("div");

      slot.className =
        "slot" +
        (entry.taken ? " taken" : "");


      const text =
        document.createElement("span");

      text.className = "text";

      /*
        Keeps exactly what you type:
        1. BUCK
        2. JOHN
        3. BAILEY
        etc.
      */
      text.textContent =
        String(entry.name);


      const strike =
        document.createElement("div");

      strike.className = "strike";


      slot.appendChild(text);
      slot.appendChild(strike);

      overlay.appendChild(slot);


      requestAnimationFrame(
        () => fitText(slot)
      );

    });
}


onValue(
  entriesRef,
  snapshot => {

    const data =
      snapshot.val() || [];

    const entries =
      Array.isArray(data)
        ? data
        : Object.values(data);

    render(entries);
  }
);


window.addEventListener(
  "resize",
  () => {

    document
      .querySelectorAll(".slot")
      .forEach(fitText);

  }
);

</script>
</body>
</html>
