<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buck Buck Overlay</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent!important;
  font-family:Arial,Helvetica,sans-serif;
}

/* Keep the overlay locked to the exact proportions of buckbuck.png */
#overlay{
  position:relative;
  width:100vw;
  height:100vh;
  background:url("./buckbuck.png") top center/contain no-repeat;
}

/*
  These 11 slots are mapped directly to the 11 red boxes
  in your current buckbuck.png.
*/
.name{
  position:absolute;
  left:15.2%;
  width:69.6%;
  height:4.7%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 4%;
  overflow:hidden;
  white-space:nowrap;
  color:#fff;
  font-weight:900;
  letter-spacing:.015em;
  text-transform:uppercase;
  text-align:center;
  text-shadow:
    0 2px 3px #000,
    0 0 7px #000,
    0 0 10px rgba(255,0,0,.55);
}

/* Exact vertical centers for each graphic line */
.name:nth-child(1){top:26.35%}
.name:nth-child(2){top:32.35%}
.name:nth-child(3){top:38.35%}
.name:nth-child(4){top:44.35%}
.name:nth-child(5){top:50.25%}
.name:nth-child(6){top:56.20%}
.name:nth-child(7){top:62.10%}
.name:nth-child(8){top:68.15%}
.name:nth-child(9){top:74.10%}
.name:nth-child(10){top:80.05%}
.name:nth-child(11){top:86.00%}

.name span{
  display:inline-block;
  max-width:100%;
  line-height:1;
  transform-origin:center center;
}

.name.taken span{
  opacity:.38;
}

.name.taken::before,
.name.taken::after{
  content:"";
  position:absolute;
  left:6%;
  right:6%;
  top:50%;
  height:4px;
  border-radius:999px;
  background:#ff1d25;
  box-shadow:0 0 7px rgba(255,29,37,.9);
  z-index:4;
}
.name.taken::before{transform:rotate(2deg)}
.name.taken::after{transform:rotate(-2deg)}
</style>
</head>

<body>
<div id="overlay"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import { firebaseConfig, ROOM_ID } from "./config.js";

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const entriesRef=ref(db,`boards/${ROOM_ID}/buckbuck/entries`);
const overlay=document.getElementById("overlay");

/*
  Shrinks each line until the ENTIRE thing fits inside its red box.
  This preserves your typed numbering, e.g. "1. JEFFREY".
*/
function fitText(row){
  const span=row.querySelector("span");
  const maxWidth=row.clientWidth * .90;
  const maxHeight=row.clientHeight * .68;

  let size=Math.max(12,Math.min(40,row.clientHeight*.60));
  span.style.fontSize=size+"px";
  span.style.transform="scale(1)";

  while(
    (span.scrollWidth>maxWidth || span.scrollHeight>maxHeight) &&
    size>11
  ){
    size-=1;
    span.style.fontSize=size+"px";
  }

  if(span.scrollWidth>maxWidth){
    span.style.transform=`scaleX(${maxWidth/span.scrollWidth})`;
  }
}

function render(entries){
  overlay.querySelectorAll(".name").forEach(el=>el.remove());

  entries
    .filter(e=>e && e.name && String(e.name).trim())
    .slice(0,11)
    .forEach(entry=>{
      const row=document.createElement("div");
      row.className="name"+(entry.taken?" taken":"");

      const span=document.createElement("span");
      span.textContent=String(entry.name);
      row.appendChild(span);

      overlay.appendChild(row);
      requestAnimationFrame(()=>fitText(row));
    });
}

onValue(entriesRef,snap=>{
  const data=snap.val()||[];
  const entries=Array.isArray(data)?data:Object.values(data);
  render(entries);
});

window.addEventListener("resize",()=>{
  document.querySelectorAll(".name").forEach(fitText);
});
</script>
</body>
</html>
